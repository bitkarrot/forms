<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form</title>
  <link rel="stylesheet" href="/ext-assets/forms/_lnbits/quasar.css">
  <link rel="stylesheet" href="/ext-assets/forms/_lnbits/material-icons.css">
  <link rel="stylesheet" href="/ext-assets/forms/_lnbits/bundle.min.css">
  <link rel="stylesheet" href="/ext-assets/forms/css/public.css">
  <link rel="stylesheet" href="/ext-assets/forms/css/theme.css">
</head>
<body>
<div id="q-app" class="vue-pending">
  <div class="public-page" :style="pageStyle">
    <div class="pf-form">
      <div v-if="loading" class="text-center q-pa-xl"><q-spinner color="primary" size="3rem"></q-spinner><div class="q-mt-md">Loading…</div></div>
      <q-card v-else-if="loadError" class="pf-card text-center"><q-icon name="error_outline" color="negative" size="3rem"></q-icon><div class="text-h6 q-mt-md">{{loadError}}</div><q-btn outline color="primary" class="q-mt-md" label="Retry" @click="loadFlow()"></q-btn></q-card>
      <template v-else-if="flow && confirmed">
        <div v-if="settings.endImage" class="pf-banner" :style="endBannerStyle"></div>
        <q-card class="pf-card text-center">
          <q-icon name="check_circle" color="positive" size="3rem"></q-icon>
          <div class="text-h5 q-mt-md">{{settings.confirmText || 'Thanks — your submission has been received.'}}</div>
          <div v-if="submission && submission.ticketCode" class="q-mt-lg">
            <div class="text-caption text-grey-7">Your confirmation code</div>
            <div class="text-h6 ticket-code">{{submission.ticketCode}}</div>
          </div>
        </q-card>
      </template>
      <template v-else-if="flow">
        <div class="pf-headerblock">
          <div v-if="settings.headerImage" class="pf-banner" :style="bannerStyle"></div>
          <template v-if="!isStepper || step===-1">
            <h1 class="pf-title">{{flow.title}}</h1>
            <p v-if="flow.description" class="pf-desc">{{flow.description}}</p>
            <div v-if="flow.remaining!==null && flow.remaining!==undefined" class="pf-remaining">{{flow.remaining}} spot(s) remaining</div>
          </template>
        </div>
        <div v-if="isStepper && step===-1" class="tf-stage text-center">
          <q-btn unelevated no-caps color="primary" size="lg" @click="step=0"><span>Start</span><q-icon name="arrow_forward" class="q-ml-sm"></q-icon></q-btn>
          <div v-if="pricing.mode==='fixed' && pricing.amountSat>0" class="pf-hint q-mt-md">{{formatSats(pricing.amountSat)}} sats to complete</div>
        </div>
        <template v-else>
          <div :class="{'tf-stage': isStepper}">
          <template v-for="(field, i) in formFields"><div :key="field.id" v-if="!isStepper || i===step" class="pf-card" :class="{'tf-flat': isStepper}">
            <template v-if="isStepper">
              <div class="tf-q">
                <div class="tf-qnum">{{i+1}} <q-icon name="arrow_forward" size="0.9em"></q-icon></div>
                <div class="tf-qlabel">{{field.label}}<span v-if="!field.required && !isOptionalLabel(field)" class="tf-opt">(optional)</span></div>
                <div v-if="field.help" class="tf-qhelp">{{field.help}}</div>
                <q-input v-if="['text','email','phone','number','date','nostr_pubkey'].includes(field.type)" outlined :type="field.type==='number'?'number':(field.type==='date'?'date':'text')" v-model="answers[field.id]" placeholder="Type your answer here…"></q-input>
                <q-input v-else-if="field.type==='textarea'" outlined type="textarea" rows="4" v-model="answers[field.id]" placeholder="Type your answer here…"></q-input>
                <q-select v-else-if="field.type==='select'" outlined :options="field.options||[]" v-model="answers[field.id]" placeholder="Choose an option"></q-select>
                <div v-else-if="field.type==='radio'" class="tf-options">
                  <div v-for="(opt, oi) in field.options||[]" :key="oi" class="tf-option" :class="{'tf-selected': answers[field.id]===opt}" @click="chooseOption(field, opt)">
                    <span class="tf-key">{{optionKey(oi)}}</span>
                    <span class="tf-optext">{{opt}}</span>
                    <q-icon v-if="answers[field.id]===opt" name="check" class="tf-check"></q-icon>
                  </div>
                </div>
                <q-checkbox v-else-if="['checkbox','consent'].includes(field.type)" v-model="answers[field.id]" :label="field.type==='consent'?'I accept':'Yes'"></q-checkbox>
                <div v-if="field.type==='nostr_pubkey'" class="pf-hint q-mt-sm">Nostr sign-in is not available on this page. Paste your npub manually, or use the embedded form on the organizer's website for one-click login.</div>
              </div>
            </template>
            <template v-else>
              <div class="pf-qlabel">{{field.label}}<span v-if="field.required" class="pf-req">*</span><span v-else-if="!isOptionalLabel(field)" class="tf-opt">(optional)</span></div>
              <div v-if="field.help" class="pf-qhelp">{{field.help}}</div>
              <q-input v-if="['text','email','phone','number','date','nostr_pubkey'].includes(field.type)" outlined :type="field.type==='number'?'number':(field.type==='date'?'date':'text')" v-model="answers[field.id]" placeholder="Type your answer here…"></q-input>
              <q-input v-else-if="field.type==='textarea'" outlined type="textarea" rows="3" v-model="answers[field.id]" placeholder="Type your answer here…"></q-input>
              <q-select v-else-if="field.type==='select'" outlined :options="field.options||[]" v-model="answers[field.id]" placeholder="Choose an option"></q-select>
              <div v-else-if="field.type==='radio'" class="tf-options">
                <div v-for="(opt, oi) in field.options||[]" :key="oi" class="tf-option" :class="{'tf-selected': answers[field.id]===opt}" @click="answers[field.id]=opt">
                  <span class="tf-key">{{optionKey(oi)}}</span>
                  <span class="tf-optext">{{opt}}</span>
                  <q-icon v-if="answers[field.id]===opt" name="check" class="tf-check"></q-icon>
                </div>
              </div>
              <q-checkbox v-else-if="['checkbox','consent'].includes(field.type)" v-model="answers[field.id]" :label="field.type==='consent'?'I accept':'Yes'"></q-checkbox>
              <div v-if="field.type==='nostr_pubkey'" class="pf-hint q-mt-sm">Nostr sign-in is not available on this page. Paste your npub manually, or use the embedded form on the organizer's website for one-click login.</div>
            </template>
          </div></template>
          <div v-if="isStepper" class="text-center">
            <q-btn unelevated no-caps color="primary" :loading="submitting" @click="onOk">
              <span>{{isLastStep ? submitLabel : 'OK'}}</span><q-icon v-if="!isLastStep" name="check" class="q-ml-xs"></q-icon>
            </q-btn>
            <div class="tf-hint">press <b>Enter ↵</b> or use the <b>↓ ↑</b> arrows</div>
          </div>
          <div v-if="isStepper" class="tf-nav" role="group" aria-label="Question navigation">
            <q-btn unelevated dense square icon="keyboard_arrow_up" :disable="step<=0" aria-label="Previous question" @click="prevStep"></q-btn>
            <q-btn unelevated dense square icon="keyboard_arrow_down" aria-label="Next question" @click="onOk"></q-btn>
          </div>
          <q-linear-progress v-if="isStepper" :value="stepProgress" class="tf-progress" aria-label="Form progress"></q-linear-progress>
          <q-btn v-else unelevated no-caps color="primary" size="lg" class="full-width q-mt-sm" :loading="submitting" :label="submitLabel" @click="submit"></q-btn>
          </div>
        </template>
      </template>
    </div>
    <q-dialog v-model="invoiceDialog" position="top" @hide="onInvoiceHide"><q-card class="q-pa-lg" style="min-width:min(92vw,420px)">
      <div v-if="invoice">
        <div class="text-h6 text-center">Pay {{formatSats(invoice.amountSat)}} sats</div>
        <div v-if="expiresInText" class="text-center text-caption text-grey-7">Expires in {{expiresInText}}</div>
        <div class="qr-box q-my-md"><qrcode-vue :value="'LIGHTNING:'+invoice.paymentRequest.toUpperCase()" :size="240"></qrcode-vue></div>
        <div class="row justify-center q-mb-md"><q-btn unelevated no-caps color="primary" icon="bolt" label="Open in wallet" :href="'lightning:'+invoice.paymentRequest"></q-btn></div>
        <q-input outlined readonly type="textarea" autogrow :model-value="invoice.paymentRequest" label="BOLT11 invoice"><template #append><q-btn flat round dense icon="content_copy" aria-label="Copy invoice" @click="copyInvoice"></q-btn></template></q-input>
        <div class="pending-row q-mt-md" aria-live="polite"><q-spinner-dots color="primary" size="2rem"></q-spinner-dots><span>Waiting for verified payment…</span></div>
        <div class="text-center q-mt-sm"><q-btn flat dense no-caps color="grey-7" label="Cancel" @click="cancelInvoice"></q-btn></div>
      </div>
    </q-card></q-dialog>
  </div>
</div>
<script src="/ext-assets/forms/_lnbits/vue.global.prod.js"></script>
<script src="/ext-assets/forms/_lnbits/quasar.umd.prod.js"></script>
<script src="/ext-assets/forms/_lnbits/qrcode.vue.browser.js"></script>
<script src="/ext-assets/forms/js/bridge.js"></script>
<script src="/ext-assets/forms/js/public-template.js"></script>
<script src="/ext-assets/forms/js/public.js"></script>
</body></html>
