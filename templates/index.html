<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forms</title>
  <link rel="stylesheet" href="/ext-assets/forms/_lnbits/quasar.css">
  <link rel="stylesheet" href="/ext-assets/forms/_lnbits/material-icons.css">
  <link rel="stylesheet" href="/ext-assets/forms/_lnbits/bundle.min.css">
  <link rel="stylesheet" href="/ext-assets/forms/css/index.css">
  <link rel="stylesheet" href="/ext-assets/forms/css/theme.css">
</head>
<body>
<div id="q-app" class="vue-pending">
  <div class="q-pa-md" style="max-width:960px;margin:0 auto">
    <div class="row items-center q-mb-md">
      <div class="text-h5">Paid Workflows</div>
      <q-space></q-space>
      <q-btn flat round dense :icon="isDark?'light_mode':'dark_mode'" aria-label="Toggle theme" @click="toggleTheme"></q-btn>
      <q-btn unelevated no-caps color="primary" icon="add" label="New flow" @click="openFlowDialog()"></q-btn>
    </div>
    <div v-if="loading" class="text-center q-pa-xl"><q-spinner color="primary" size="3rem"></q-spinner></div>
    <q-card v-else-if="loadError" class="q-pa-lg text-center"><q-icon name="error_outline" color="negative" size="3rem"></q-icon><div class="text-h6 q-mt-md">{{loadError}}</div><q-btn outline color="primary" class="q-mt-md" label="Retry" @click="load()"></q-btn></q-card>
    <q-card v-else-if="!flows.length" class="q-pa-xl text-center text-grey-7">No flows yet. Create a paid registration or signup form to get started.</q-card>
    <q-table v-else :rows="flows" :columns="columns" row-key="id" flat bordered :pagination="{rowsPerPage:20}">
      <template #body-cell-status="props"><q-td :props="props"><q-badge :color="statusColor(props.row.status)">{{props.row.status}}</q-badge></q-td></template>
      <template #body-cell-price="props"><q-td :props="props">{{priceLabel(props.row)}}</q-td></template>
      <template #body-cell-actions="props"><q-td :props="props">
        <q-btn flat dense no-caps size="sm" icon="link" label="Link" @click="copyPublicLink(props.row)"></q-btn>
        <q-btn v-if="props.row.status!=='published'" flat dense no-caps size="sm" color="positive" label="Publish" @click="setStatus(props.row,'published')"></q-btn>
        <q-btn v-if="props.row.status==='published'" flat dense no-caps size="sm" color="warning" label="Close" @click="setStatus(props.row,'closed')"></q-btn>
        <q-btn flat dense no-caps size="sm" icon="edit" label="Edit" @click="openFlowDialog(props.row)"></q-btn>
        <q-btn flat dense no-caps size="sm" icon="list" label="Submissions" @click="openSubmissions(props.row)"></q-btn>
      </q-td></template>
    </q-table>

    <q-dialog v-model="flowDialog.show"><q-card class="q-pa-lg" style="min-width:min(92vw,560px)">
      <div class="text-h6 q-mb-md">{{flowDialog.editing?'Edit flow':'New flow'}}</div>
      <div class="q-gutter-md">
        <q-input outlined dense v-model="flowDialog.data.title" label="Title" :rules="[v=>Boolean(v&&v.trim())||'Required']"></q-input>
        <q-input outlined dense type="textarea" autogrow v-model="flowDialog.data.description" label="Description"></q-input>
        <q-select outlined dense v-model="flowDialog.data.walletId" :options="walletOptions" emit-value map-options label="Payout wallet" :disable="flowDialog.editing"></q-select>
        <q-input outlined dense type="number" min="0" v-model.number="flowDialog.data.amountSat" label="Price (sats, 0 = free)"></q-input>
        <q-input outlined dense type="number" min="0" v-model.number="flowDialog.data.capacity" label="Capacity (0 = unlimited)"></q-input>
        <q-select outlined dense v-model="flowDialog.data.theme" :options="themeOptions" label="Theme"></q-select>
        <div>
          <div class="text-subtitle2 q-mb-xs">Fields (one per line: <code>id|type|label|required|options,a,b</code>)</div>
          <q-input outlined dense type="textarea" rows="6" v-model="flowDialog.data.fieldsText" hint="Types: text, email, phone, textarea, number, date, select, radio, checkbox, consent, nostr_pubkey"></q-input>
        </div>
        <q-input outlined dense type="textarea" rows="3" v-model="flowDialog.data.customCss" label="Custom CSS (optional)"></q-input>
        <div v-if="formError" class="text-negative" role="alert">{{formError}}</div>
        <div class="row justify-end q-gutter-sm">
          <q-btn flat no-caps label="Cancel" @click="flowDialog.show=false"></q-btn>
          <q-btn unelevated no-caps color="primary" label="Save" :loading="saving" @click="saveFlow"></q-btn>
        </div>
      </div>
    </q-card></q-dialog>

    <q-dialog v-model="subsDialog.show"><q-card class="q-pa-lg" style="min-width:min(92vw,720px)">
      <div class="text-h6 q-mb-md">Submissions — {{subsDialog.flow&&subsDialog.flow.title}}</div>
      <q-table :rows="subsDialog.rows" :columns="subColumns" row-key="id" flat dense :pagination="{rowsPerPage:10}">
        <template #body-cell-status="props"><q-td :props="props"><q-badge :color="statusColor(props.row.status)">{{props.row.status}}</q-badge></q-td></template>
        <template #body-cell-actions="props"><q-td :props="props">
          <q-btn v-if="['paid','confirmed'].includes(props.row.status)" flat dense no-caps size="sm" label="Approve" @click="moderate(props.row,'approved')"></q-btn>
          <q-btn v-if="['paid','confirmed'].includes(props.row.status)" flat dense no-caps size="sm" color="negative" label="Reject" @click="moderate(props.row,'rejected')"></q-btn>
        </q-td></template>
      </q-table>
      <div class="row justify-end q-mt-md"><q-btn flat no-caps label="Export CSV" @click="exportCsv"></q-btn><q-btn flat no-caps label="Close" @click="subsDialog.show=false"></q-btn></div>
    </q-card></q-dialog>
  </div>
</div>
<script src="/ext-assets/forms/_lnbits/vue.global.prod.js"></script>
<script src="/ext-assets/forms/_lnbits/quasar.umd.prod.js"></script>
<script src="/ext-assets/forms/js/bridge.js"></script>
<script src="/ext-assets/forms/js/index-template.js"></script>
<script src="/ext-assets/forms/js/index.js"></script>
</body></html>
